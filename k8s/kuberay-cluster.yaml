apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: mlops-distributed-ray-cluster
  namespace: kuberay-system
spec:
  rayVersion: '2.20.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.20.0-py311
            resources:
              limits:
                cpu: "4"
                memory: 8Gi
              requests:
                cpu: "2"
                memory: 4Gi
  workerGroupSpecs:
    - groupName: worker-group
      replicas: 4
      minReplicas: 1
      maxReplicas: 16
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: rayproject/ray:2.20.0-py311
              resources:
                limits:
                  cpu: "8"
                  memory: 16Gi
                requests:
                  cpu: "4"
                  memory: 8Gi
