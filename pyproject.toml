[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-mlops-platform"
version = "1.0.0"
description = "Self-Healing Enterprise MLOps Platform & Continuous Evaluation Mesh"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bernard B. Das", email = "bernard@example.com" }
]
dependencies = [
    "kserve>=0.13.0",
    "evidently>=0.4.20",
    "mlflow>=2.13.0",
    "ray[default]>=2.20.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
    "kubernetes>=29.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
mlops-controller = "src.controller:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
